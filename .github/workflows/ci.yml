name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint and verify formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test the installed command
        run: ci-permission-review --format json --fail-on-findings examples/fake-defaults.yml
