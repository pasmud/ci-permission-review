[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-permission-review"
version = "0.1.0"
description = "Offline review of GitHub Actions workflow token permissions"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
ci-permission-review = "ci_permission_review.cli:main"

[tool.setuptools.packages.find]
include = ["ci_permission_review*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
